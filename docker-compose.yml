services:

  # PostgreSQL com extensao PostGIS - dados cadastrais, geometria espacial
  # (geofencing das zonas seguras) e schema_history do Flyway
  postgres:
    image: postgis/postgis:16-3.4
    container_name: condosafe-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: condosafe
      POSTGRES_USER: condosafe
      POSTGRES_PASSWORD: condosafe
    ports:
      - "5432:5432"
    volumes:
      - condosafe-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/10-init-postgis.sql:ro
      - ./infra/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/20-init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condosafe -d condosafe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis - anti-replay do QR Code (SET NX EX 30), geofencing
  # (GEOADD/GEOSEARCH) e contadores de evacuados em memoria
  redis:
    image: redis:7-alpine
    container_name: condosafe-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - condosafe-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Kafka em modo KRaft (sem Zookeeper). Topicos:
  # access-events, incident-events, evacuation-telemetry
  kafka:
    image: apache/kafka:3.7.0
    container_name: condosafe-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "Zm9vYmFyY29uZG9zYWZl"
    volumes:
      - condosafe-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Keycloak - Identity Provider (OIDC / OAuth2 Resource Server)
  # Persiste no Postgres (base dedicada condosafe_iam).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: condosafe-keycloak
    hostname: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/condosafe_iam
      KC_DB_USERNAME: condosafe
      KC_DB_PASSWORD: condosafe
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  condosafe-postgres-data:
  condosafe-redis-data:
  condosafe-kafka-data: